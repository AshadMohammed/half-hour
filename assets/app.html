<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>half hour</title>
<style>
@font-face{font-family:BSC;font-style:normal;font-weight:300;font-display:swap;src:url(fonts/bsc-300.woff2) format('woff2')}
@font-face{font-family:BSC;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bsc-400.woff2) format('woff2')}
@font-face{font-family:BSC;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/bsc-500.woff2) format('woff2')}
:root{
  /* paper line's page, machined face's metal, raw grid's rules */
  --paper:#ecebe8;--paper-2:#e0ded8;--ink:#161615;--meta:#5b5954;--hair:#85827c;--faint:#b9b6af;--off:#6a6762;
  --m-hi:#e4e2dd;--m:#d3d1cb;--m-lo:#c0beb8;--well:#1c1d1d;--skirt:#0b0c0c;--eng:#3d3b37;--eng-2:#55524d;
  --oled:#050607;--px:#eef3f3;--px-dim:#8d999b;
  --acc:#ee6923;   /* record lamp, selection, now. graphics only, never text */
  --disp:BSC,"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;   /* thin reading type, 300 */
  --body:BSC,"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;   /* legends and labels, 400/500 */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' seed='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='.9' intercept='.05'/><feFuncG type='linear' slope='.9' intercept='.05'/><feFuncB type='linear' slope='.9' intercept='.05'/><feFuncA type='linear' slope='0' intercept='1'/></feComponentTransfer></filter><rect width='220' height='220' filter='url(%23f)'/></svg>");
  --grain-m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='1.35' numOctaves='2' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='1.1' intercept='-.05'/><feFuncG type='linear' slope='1.1' intercept='-.05'/><feFuncB type='linear' slope='1.1' intercept='-.05'/><feFuncA type='linear' slope='0' intercept='1'/></feComponentTransfer></filter><rect width='160' height='160' filter='url(%23f)'/></svg>");
  --metal:var(--grain-m),linear-gradient(180deg,var(--m-hi) 0%,var(--m) 55%,var(--m-lo) 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
body.desk{background:#d6d4cf}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:left}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* the window is the page: insets are applied by fit() as the stage's own box */
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:clip;display:flex;flex-direction:column;isolation:isolate;
  background-color:var(--paper);background-image:var(--grain);background-blend-mode:overlay}
.screens{flex:1;position:relative;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:none;padding:12px 22px 28px;scrollbar-width:none;
  background-color:var(--paper);background-image:var(--grain);background-blend-mode:overlay}
.screen::-webkit-scrollbar{display:none}
.screen.leaving{z-index:0}.screen.on{z-index:1}
.screen.on,.screen.leaving{display:block}
#s-log.on,#s-log.leaving{display:flex;flex-direction:column;overflow:hidden;padding-bottom:10px}
.leg{font:500 13px/1 var(--body);color:var(--meta);letter-spacing:.03em}

/* ---- header: name left, the one display right ---- */
.hd{display:flex;justify-content:space-between;align-items:flex-start;flex:none;min-height:50px}
.wm{display:flex;flex-direction:column;gap:7px;padding-top:4px}
.wm .nm{font:300 22px/1 var(--disp);letter-spacing:.005em}
.wm .dt{font:500 13px/1 var(--body);color:var(--meta);letter-spacing:.03em}
.oled{width:140px;height:50px;flex:none;background:var(--oled);border-radius:8px;padding:8px 10px 7px;display:flex;flex-direction:column;justify-content:space-between;
  color:var(--px);box-shadow:0 0 0 1px #000,0 1px 0 1.5px rgba(255,255,255,.8),inset 0 1px 6px rgba(255,255,255,.05)}
.oled .o2{display:flex;justify-content:space-between;align-items:center;color:var(--px-dim)}
.chip{display:inline-flex;background:var(--px);color:var(--oled);border-radius:2px;padding:1.5px 2.5px}
.dm{display:block}

/* ---- log ---- */
.whenrow{display:flex;align-items:center;margin:clamp(6px,2vh,18px) -12px 0;flex:none}
.whenrow .chev{flex:none}
#log-block{flex:1;min-width:0;min-height:48px;text-align:left;font:300 clamp(26px,8.4vw,32px)/1.05 var(--disp);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;min-height:22px;margin-top:0;font:400 15px/1.2 var(--body);color:var(--meta)}
.sub #lSub{min-width:0}
.linkb{flex:none;min-height:44px;margin:-14px 0;padding:0 2px 0 10px;font:500 14px/1 var(--body);color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--acc);text-decoration-thickness:2px}
.say{flex:1 1 auto;min-height:92px;position:relative;margin-top:clamp(8px,1.6vh,18px);container-type:size}
.say textarea{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;resize:none;outline:none;padding:0;z-index:2;
  font:300 28px/1.18 var(--disp);color:var(--ink);caret-color:var(--acc);user-select:text;-webkit-user-select:text}
.say textarea::placeholder{color:var(--off)}
.say.blank textarea::placeholder{color:transparent}
.say.rec textarea,.say.work textarea,.say.err textarea{visibility:hidden}
.machine{position:absolute;left:0;right:0;top:46px;bottom:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.say.blank .machine,.say.rec .machine,.say.work .machine,.say.err .machine{display:flex}
.mwrap{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.machine .mach{height:min(158px,calc(100cqh - 108px));width:auto}
.mcap{font:500 13px/1.4 var(--body);color:var(--meta);letter-spacing:.03em;min-height:36px}
.say.err .mcap{color:var(--ink)}
@container (max-height:150px){.machine .mach{display:none}.machine{top:34px}}
.prog{position:absolute;left:0;right:0;top:0;display:none}
.say.rec .prog,.say.work .prog,.say.err .prog{display:block}
.prog .row{display:flex;justify-content:space-between;font:400 15px/1 var(--body);color:var(--meta);margin-bottom:11px}
.prog .row b{font-weight:500;color:var(--ink)}
.prog .line{height:1px;background:var(--hair);position:relative}
.prog .line i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.prog .line .w{width:22%;animation:shuttle 1.2s cubic-bezier(.45,0,.55,1) infinite alternate}
.prog .head{position:absolute;top:-8px;width:2px;height:17px;background:var(--acc)}
@keyframes shuttle{from{left:0}to{left:78%}}
.plan{flex:none;min-height:0;margin-top:6px;font:400 14px/1.3 var(--body);color:var(--meta);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plan:empty{display:none}
.plan b{font-weight:500;color:var(--ink)}
.plan i{font-style:normal;font-weight:500;color:var(--ink)}

/* the wireframe recorder: hairline drawing, its reel turns while you talk */
.mach{display:block;overflow:visible;color:var(--ink)}
.mach *{vector-effect:non-scaling-stroke}
.mach .reel{transform-box:view-box;transform-origin:60px 68px}
.mach .scr{fill:var(--ink);stroke:none}
.mach .eng{fill:var(--ink);stroke:none;font:500 5.4px var(--body);letter-spacing:.06em}
.mach .mdot,.mach .mlamp{fill:none}
.live .mach .reel{animation:spin 2.2s linear infinite}
.work .mach .reel{animation:spin 7s linear infinite}
.live .mach .mlamp,.live .mach .mdot{fill:var(--acc);stroke:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
html.hid *{animation-play-state:paused!important}

/* ---- score: a machined fader on a paper line ---- */
.score{flex:none;margin-top:8px}
.sl{display:flex;justify-content:space-between;align-items:baseline}
.sv{font:300 18px/1 var(--disp)}
.sv b{font-weight:400;margin-right:7px}
.track{position:relative;height:56px;touch-action:none;cursor:pointer;margin-top:2px}
.groove{position:absolute;left:12px;right:12px;top:16px;height:5px;border-radius:3px;background:var(--well);
  box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 1px 1px rgba(0,0,0,.6)}
.st{position:absolute;top:0;width:44px;height:56px;margin-left:-22px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.st i{width:1px;height:6px;background:var(--hair);margin-top:28px}
.st b{font:500 14px/1 var(--body);color:var(--meta);margin-top:5px}
.st.on b{color:var(--ink)}
.capk{position:absolute;top:8px;width:30px;height:21px;margin-left:-15px;border-radius:4px;background-image:var(--metal);background-blend-mode:overlay,normal;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 0 rgba(0,0,0,.3),0 3px 4px rgba(0,0,0,.28);transition:left .28s cubic-bezier(.3,1.4,.5,1)}
.capk::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;background:var(--ink)}

/* ---- the deck: three keys in a well, the log-ahead fader beside them ---- */
.deckhd{display:flex;justify-content:space-between;align-items:center;margin-top:4px;height:22px;flex:none}
.lampw{display:flex;align-items:center;gap:8px}
.lamp{width:12px;height:12px;border-radius:50%;background:#a8a59f;box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.9);transition:background .12s,box-shadow .12s}
.lamp.on{background:#ff6b28;box-shadow:inset 0 0 2px rgba(255,255,255,.75),0 0 0 3px rgba(238,105,35,.22),0 0 16px 5px rgba(255,92,30,.55)}
.lamp.blink{animation:b1 1.1s steps(1) infinite;background:#ff6b28}
@keyframes b1{50%{opacity:.25}}
.deck{display:flex;gap:10px;height:clamp(96px,14.8vh,124px);flex:none;margin:6px -9px 0}
.well{flex:1;display:flex;gap:5px;padding:5px 5px 8px;background:var(--well);border-radius:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 2px 3px rgba(0,0,0,.7)}
.key{flex:1;position:relative;border-radius:5px;background-image:var(--metal);background-blend-mode:overlay,normal;color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.08),0 3px 0 var(--skirt);
  transition:transform .16s cubic-bezier(.3,1.8,.5,1),box-shadow .16s;user-select:none;-webkit-user-select:none;touch-action:none}
.key.live .dot{box-shadow:0 0 0 3px rgba(238,105,35,.25),0 0 14px 3px rgba(255,92,30,.6)}
.key.down,.key.live,.key.done{transform:translateY(3px);box-shadow:inset 0 2px 5px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4),0 0 0 var(--skirt);transition-duration:.04s}
.key .g{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:grid;place-items:center}
.key .lg{position:absolute;left:9px;bottom:9px;font:500 13px/1 var(--body);color:var(--eng);letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.key .mi{position:absolute;right:8px;top:8px;font:500 11px/1 var(--body);color:var(--eng);letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--acc);display:block;box-shadow:inset 0 -1px 1px rgba(0,0,0,.18)}
.key.wait .dot{animation:b1 1.1s steps(1) infinite}
.eq{width:22px;height:14px;display:block;background:linear-gradient(var(--ink),var(--ink)) top/100% 4px no-repeat,linear-gradient(var(--ink),var(--ink)) bottom/100% 4px no-repeat}
.sq{width:15px;height:15px;background:var(--ink);display:block}
.ck{width:20px;height:12px;display:block;position:relative}
.ck::before{content:"";position:absolute;left:3px;top:-3px;width:8px;height:16px;border:solid var(--ink);border-width:0 4px 4px 0;transform:rotate(40deg)}
.xg{width:17px;height:17px;display:block;position:relative}
.xg::before,.xg::after{content:"";position:absolute;left:-2px;right:-2px;top:7px;height:3.5px;background:var(--ink);transform:rotate(45deg)}
.xg::after{transform:rotate(-45deg)}
.fader{width:62px;flex:none;position:relative;touch-action:none;cursor:pointer}
.fader .gv{position:absolute;right:13px;top:9px;bottom:9px;width:5px;border-radius:3px;background:var(--well);box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 1px 1px rgba(0,0,0,.6)}
.fader .fc{position:absolute;right:2px;width:27px;height:17px;margin-top:-8.5px;border-radius:3px;background-image:var(--metal);background-blend-mode:overlay,normal;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 0 rgba(0,0,0,.3),0 3px 4px rgba(0,0,0,.28);transition:top .26s cubic-bezier(.3,1.4,.5,1)}
.fader .fc::after{content:"";position:absolute;left:4px;right:4px;top:7.5px;height:2px;background:var(--ink)}
.fader .s2{position:absolute;left:0;font:500 13px/1 var(--body);color:var(--meta);transform:translateY(-50%);letter-spacing:.02em}
.fader .s2.on{color:var(--ink)}

/* ---- nav ---- */
.nav{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:64px;border-top:1px solid var(--hair);padding:0 8px;
  background-color:var(--paper);background-image:var(--grain);background-blend-mode:overlay;z-index:3}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--meta);font:500 13px/1 var(--body);letter-spacing:.03em;min-height:44px}
.nav button svg{fill:currentColor;opacity:.7}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"] svg{opacity:1}
.nav .ind{position:absolute;top:-2px;left:8px;width:calc((100% - 16px)/4);transition:transform .44s cubic-bezier(.33,0,.12,1);pointer-events:none}
.nav .ind::after{content:"";display:block;width:30px;height:3px;background:var(--ink);margin:0 auto}

/* ---- today ---- */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:10px -12px 0}
.dayhead .dayt{flex:1;min-height:44px;text-align:center;font:300 24px/1.1 var(--disp);letter-spacing:-.005em}
.chev{width:44px;height:44px;display:grid;place-items:center;flex:none}
.chev[disabled]{opacity:.3;cursor:default}
.rd{height:112px;margin-top:6px;display:flex;flex-direction:column}
.rd .t{font:400 14px/1.2 var(--body);color:var(--meta)}
.rd .x{font:300 27px/1.15 var(--disp);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd .s{display:flex;justify-content:space-between;align-items:center;gap:6px;flex:1;min-height:46px;font:400 15px/1.2 var(--body);color:var(--meta)}
.rd .s>span:first-child{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rd .ks{display:flex;flex:none}
.mkey{min-height:44px;min-width:44px;padding:0 16px;margin:3px;border-radius:6px;font:500 14px/1 var(--body);color:var(--eng);letter-spacing:.02em;flex:none;display:grid;place-items:center;
  background-image:var(--metal);background-blend-mode:overlay,normal;text-shadow:0 1px 0 rgba(255,255,255,.6);
  box-shadow:0 0 0 3px var(--well),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .14s cubic-bezier(.3,1.8,.5,1)}
.mkey.down{transform:translateY(1px);box-shadow:0 0 0 3px var(--well),inset 0 2px 4px rgba(0,0,0,.3)}
/* raw grid: stark black rules on pale ground, 8 x 6, full width */
.grid{position:relative;display:grid;grid-template-columns:repeat(8,1fr);margin:4px -22px 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cell{position:relative;height:48px;border-right:1px solid var(--faint);border-bottom:1px solid var(--ink);font-style:normal}
.cell:nth-child(2n){border-right-color:var(--hair)}
.cell:nth-child(8n){border-right:0}
.cell:nth-child(n+41){border-bottom:0}
.cell .hr{position:absolute;left:3px;top:3px;font:500 10.5px/1 var(--body);color:var(--meta);letter-spacing:.03em}
.cell em{position:absolute;right:4px;top:3px;font:500 11px/1 var(--body);font-style:normal;color:var(--meta)}
.cell b{position:absolute;left:50%;bottom:6px;width:22px;margin-left:-11px;background:var(--ink)}
.cell.sl::after{content:"";position:absolute;left:-1px;right:-1px;bottom:9px;height:3px;background:#96938c}
.cell.e::after{content:"";position:absolute;left:50%;bottom:7px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.f::after{content:"";position:absolute;left:50%;bottom:9px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--off)}
.cell .now{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--acc);z-index:1}
.cell.sel{background:rgba(238,105,35,.2);box-shadow:inset 0 0 0 2px var(--acc);z-index:1}
.cell.hot b{background:var(--acc)}
.grid .slp{position:absolute;left:50%;top:calc(48px * 1.5 - 6px);transform:translateX(-50%);font:500 12px/1 var(--body);color:var(--meta);letter-spacing:.04em;pointer-events:none;background:var(--paper);padding:0 6px}
.hint{font:400 14px/1.35 var(--body);color:var(--meta);margin-top:10px}
.rule{height:1px;background:var(--hair);margin:20px 0}
.tri{display:grid;grid-template-columns:repeat(3,1fr)}
.tri .n{font:300 30px/1 var(--disp);letter-spacing:-.01em}
.tri .n small{font:400 15px var(--body);margin-left:3px;color:var(--meta);letter-spacing:0}
.tri .l{font:400 14px/1.3 var(--body);color:var(--meta);margin-top:7px}
.k2{margin:0 0 10px;font:500 13px/1 var(--body);color:var(--meta);letter-spacing:.03em}
.crow{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:12px;min-height:32px}
.crow .n{font:300 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bar{height:1px;background:var(--faint);position:relative}
.crow .bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.crow .v{font:400 15px var(--body);text-align:right;font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:center;width:100%;min-height:46px;border-bottom:1px solid var(--faint)}
.lrow .tm{font:400 14px var(--body);color:var(--meta);font-variant-numeric:tabular-nums}
.lrow .tx{font:300 18px var(--disp);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sc{font:400 15px var(--body);color:var(--ink)}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;box-shadow:inset 0 0 0 1px var(--hair)}
.pips i.on{background:var(--ink);box-shadow:none}
.emp{display:flex;gap:20px;align-items:center;margin-top:24px}
.emp .mach{height:118px;width:auto;flex:none}
.emp p{margin:0;font:300 20px/1.3 var(--disp)}
.emp small{display:block;margin-top:9px;font:400 14px/1.4 var(--body);color:var(--meta)}

/* ---- week ---- */
.wcols{display:grid;grid-template-columns:56px 1fr 40px 30px;gap:10px;align-items:center}
.whead{font:500 12px/1 var(--body);color:var(--meta);letter-spacing:.03em;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.whead span:nth-child(n+3){text-align:right}
.wrow{width:100%;min-height:46px;border-bottom:1px solid var(--faint)}
.wrow .d{font:300 17px var(--disp);white-space:nowrap;position:relative}
.wrow .d.best::before{content:"";position:absolute;left:-12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--acc)}
.wrow .h{font:400 15px var(--body);text-align:right;font-variant-numeric:tabular-nums}
.wrow .a{font:400 15px var(--body);text-align:right;color:var(--meta);font-variant-numeric:tabular-nums}
.wrow svg{display:block;width:100%;height:24px}
.wnote{font:400 14px/1.35 var(--body);color:var(--meta);margin-top:9px}
.big{font:300 27px/1.15 var(--disp);letter-spacing:-.005em}

/* ---- time ---- */
.tctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tabs{display:flex;gap:18px}
.tabs button{min-height:44px;min-width:44px;font:300 18px var(--disp);color:var(--meta);position:relative}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:2px;background:var(--ink)}
.sw{position:relative;display:flex;width:118px;height:44px;padding:0;background:var(--well);border-radius:9px;box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 2px 3px rgba(0,0,0,.7)}
.sw .kn{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:5px;background-image:var(--metal);background-blend-mode:overlay,normal;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 0 var(--skirt);transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.sw button{flex:1;position:relative;z-index:1;font:500 13px/1 var(--body);color:#b4b1ab;text-align:center;letter-spacing:.03em}
.sw button[aria-pressed="true"]{color:var(--eng)}
.tstep{display:flex;align-items:center;justify-content:space-between;margin:0 -12px}
#tm-range{flex:1;min-height:44px;text-align:center;font:400 14px/1 var(--body);color:var(--meta);letter-spacing:.02em}
.box{position:relative;margin:4px -9px 0}
.box.bento{background:var(--well);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 2px 3px rgba(0,0,0,.7)}
.box.discs{border:1px solid var(--hair);border-radius:10px}
.box .fadein{animation:fade .32s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tile{position:absolute;border-radius:5px;background-image:var(--metal);background-blend-mode:overlay,normal;padding:8px 9px 9px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.08),0 2px 0 var(--skirt);
  transition:transform .16s cubic-bezier(.3,1.8,.5,1),box-shadow .16s}
.tile .n{font:400 15px/1.1 var(--disp);color:var(--ink)}
.tile .h{font:400 15px/1 var(--disp);color:var(--eng)}
.tile.big .n{font-size:17px}
.tile.big .h{font-size:26px;font-weight:300;color:var(--ink);letter-spacing:-.01em}
.tile.big .h small{font:400 14px var(--body);margin-left:2px;color:var(--eng)}
.tile[aria-pressed="true"],.tile.down{transform:translateY(2px);box-shadow:inset 0 2px 5px rgba(0,0,0,.32),0 0 0 var(--skirt)}
.tile[aria-pressed="true"]::after{content:"";position:absolute;right:9px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.disc{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}
.disc i{display:block;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);position:relative}
.disc i::after{content:"";position:absolute;left:50%;top:50%;width:16%;height:16%;min-width:6px;min-height:6px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 1.5px var(--ink)}
.disc span{font:400 13px/1 var(--body);white-space:nowrap;letter-spacing:.02em}
.disc[aria-pressed="true"] i{background:var(--ink)}
.disc[aria-pressed="true"] i::after{background:var(--paper);box-shadow:none}
.tro{margin-top:12px}
.tro .d{font:400 15px/1.4 var(--body);color:var(--meta);margin-top:5px}
.boxleg{display:flex;justify-content:space-between;margin-top:8px}

/* ---- panels: a second plate slides up ---- */
.scrim{position:absolute;inset:0;z-index:9;background:rgba(28,27,25,.3);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:12px 22px 18px;border-radius:16px 16px 0 0;
  background-color:var(--paper);background-image:var(--grain);background-blend-mode:overlay;
  box-shadow:0 -1px 0 rgba(0,0,0,.28),0 -14px 34px rgba(0,0,0,.18);transform:none;transition:transform .34s cubic-bezier(.2,.9,.3,1),visibility 0s;max-height:94%;overflow-y:auto;overscroll-behavior:contain}
.sheet[hidden]{display:block;transform:translateY(105%);visibility:hidden;pointer-events:none;transition:transform .34s cubic-bezier(.2,.9,.3,1),visibility 0s .34s}
.grab{width:44px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 14px}
.sheet h3{margin:0;font:300 25px/1.1 var(--disp);letter-spacing:-.005em}
.heard{margin:14px 0 6px;font:300 21px/1.25 var(--disp);text-wrap:pretty;user-select:text;-webkit-user-select:text}
.heard small{display:block;margin-bottom:6px}
.span{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:12px 0;border-bottom:1px solid var(--faint)}
.span .a{font:400 17px/1.1 var(--disp)}
.span .b{font:400 15px/1.2 var(--body);color:var(--meta);overflow-wrap:anywhere}
.span .s{grid-row:1/3;grid-column:2;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:7px;font:400 14px/1 var(--body);color:var(--meta)}
.span .s.new{color:var(--ink)}
#span-rows{max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
.sum{margin:12px 0 2px;font:400 15px/1.35 var(--body);color:var(--meta);text-wrap:pretty;min-height:20px}
.pk{display:flex;gap:5px;padding:5px 5px 8px;background:var(--well);border-radius:10px;height:66px;margin:14px -9px 0;box-shadow:0 1px 0 rgba(255,255,255,.9),inset 0 2px 3px rgba(0,0,0,.7)}
.pk .key{display:flex;align-items:center;justify-content:center;gap:11px}
.pk .key .lg{position:static;font-size:15px;color:var(--ink)}
.pk .key .g{position:static;transform:none}
.sheet textarea{width:100%;border:0;border-bottom:1px solid var(--ink);background:none;font:300 25px/1.2 var(--disp);resize:none;outline:none;padding:6px 0;
  color:var(--ink);caret-color:var(--acc);margin-top:12px;display:block;user-select:text;-webkit-user-select:text}
.sheet textarea::placeholder{color:var(--off)}
.sheet .sl{margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="stage">
  <div class="screens">
    <section class="screen" id="s-log" aria-label="log">
      <div class="hdslot"></div>
      <div class="whenrow">

      </div>

      <div class="say" id="say">
        <div class="prog" id="prog"></div>
        <div class="machine" id="machine" aria-hidden="true"><div class="mwrap"><div class="mcap" id="mCap"></div></div></div>
        <textarea id="log-text" rows="3" aria-label="what you did" placeholder="what did you just do?" enterkeyhint="done" autocapitalize="sentences" spellcheck="false" autocomplete="off"></textarea>
      </div>
      <div class="plan" id="log-plan"></div>
      <div class="score">

      </div>
      <div class="deckhd"><span class="lampw"><i class="lamp" id="lamp"></i><span class="leg">rec</span></span><span class="leg">log ahead</span></div>
      <div class="deck">
        <div class="well">
          <button class="key" id="log-rec" aria-label="rec, hold to talk"><span class="mi">3:00</span><span class="g"><i class="dot"></i></span><span class="lg">hold to talk</span></button>
          <button class="key" id="log-same" aria-label="same again"><span class="mi">last</span><span class="g"><i class="eq"></i></span><span class="lg">same again</span></button>
          <button class="key" id="log-save" aria-label="log it"><span class="mi">next</span><span class="g"><i class="sq" id="saveG"></i></span><span class="lg" id="saveLg">log it</span></button>
        </div>
        <div class="fader" id="log-slider" role="slider" aria-label="also log the next half hours" aria-valuemin="0" aria-valuemax="3" tabindex="0"></div>
      </div>
    </section>
    <section class="screen" id="s-today" aria-label="today">
      <div class="hdslot"></div>
      <div class="dayhead"><button class="chev" id="tod-prev" aria-label="day before"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2L2.5 11l8.5 9" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button>
        <button class="dayt" id="tod-date"></button>
        <button class="chev" id="tod-next" aria-label="day after"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M2 2l8.5 9L2 20" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button></div>
      <div class="rd" id="tod-line" aria-live="polite"></div>
      <div class="grid" id="tod-grid" tabindex="0" role="group" aria-label="48 half hours, midnight to midnight. tap to read, hold and drag to select several"></div>
      <div id="tod-body"></div>
    </section>
    <section class="screen" id="s-week" aria-label="week">
      <div class="hdslot"></div>
      <div class="dayhead"><button class="chev" id="wk-prev" aria-label="week before"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2L2.5 11l8.5 9" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button>
        <button class="dayt" id="wk-range"></button>
        <button class="chev" id="wk-next" aria-label="week after"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M2 2l8.5 9L2 20" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button></div>
      <div id="wk-body"></div>
    </section>
    <section class="screen" id="s-time" aria-label="time">
      <div class="hdslot"></div>
      <div class="tctl"><div class="tabs"><button id="tm-day" aria-pressed="false">by day</button><button id="tm-week" aria-pressed="true">by week</button></div>
        <div class="sw" role="group" aria-label="view"><span class="kn" id="tm-kn"></span><button id="tm-bento" aria-pressed="true">bento</button><button id="tm-discs" aria-pressed="false">discs</button></div></div>
      <div class="tstep"><button class="chev" id="tm-prev" aria-label="previous range"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2L2.5 11l8.5 9" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button>
        <button id="tm-range"></button>
        <button class="chev" id="tm-next" aria-label="next range"><svg width="13" height="22" viewBox="0 0 13 22"><path d="M2 2l8.5 9L2 20" fill="none" stroke="#161615" stroke-width="1.6"/></svg></button></div>
      <div class="box bento" id="tm-box"></div>
      <div class="boxleg"><span class="leg" id="tm-leg"></span><span class="leg">area is time</span></div>
      <div class="tro" id="tm-pick"></div>
    </section>
  </div>
  <nav class="nav" id="nav" aria-label="screens">
    <span class="ind" id="navInd" aria-hidden="true"></span>
    <button data-act="go:log" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm0 8a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill-rule="evenodd"/></svg>log</button>
    <button data-act="go:today" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="14" width="3" height="9"/><rect x="5.5" y="9" width="3" height="14"/><rect x="10" y="4" width="3" height="19"/><rect x="14.5" y="11" width="3" height="12"/><rect x="19" y="17" width="3" height="6"/></svg>today</button>
    <button data-act="go:week" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="2" width="22" height="3"/><rect x="1" y="7.5" width="16" height="3"/><rect x="1" y="13" width="19" height="3"/><rect x="1" y="18.5" width="11" height="3"/></svg>week</button>
    <button data-act="go:time" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="1" width="13" height="22"/><rect x="16" y="1" width="7" height="12"/><rect x="16" y="15" width="7" height="8"/></svg>time</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="fill the empty half hours">
    <div class="grab"></div>
    <h3 id="sheet-title">fill 1:00 to 3:00 pm</h3>
    <div class="sum" id="sheet-sum"></div>
    <textarea id="sheet-text" rows="2" placeholder="what was it?" aria-label="what was it" autocapitalize="sentences" spellcheck="false" autocomplete="off"></textarea>

    <div class="track" id="sheet-score" role="slider" aria-label="score" aria-valuemin="1" aria-valuemax="5" tabindex="0"></div>

      <button class="key" id="sheet-rec" aria-label="rec, hold to talk"><span class="g"><i class="dot"></i></span><span class="lg">talk</span></button>

      <button class="key" id="sheet-ok" aria-label="fill"><span class="g"><i class="sq"></i></span><span class="lg">fill</span></button>
    </div>
  </div>
  <div class="sheet" id="span-sheet" hidden role="dialog" aria-modal="true" aria-label="check before saving">
    <div class="grab"></div>
    <h3>check before saving</h3>

      <button class="key" id="span-x" aria-label="dismiss"><span class="g"><i class="xg"></i></span><span class="lg">dismiss</span></button>
      <button class="key" id="span-ok" aria-label="log it"><span class="g"><i class="sq"></i></span><span class="lg">log it</span></button>
    </div>
  </div>
</div>

<script>
/* errors are counted on <html data-errors> so a headless run can check the page plainly */
function lg(){try{console.log('[js] '+Array.prototype.join.call(arguments,' '))}catch(e){}}
window.addEventListener('unhandledrejection',function(e){lg('promise error',e.reason)});
window.addEventListener('error',function(e){var d=document.documentElement;d.dataset.errors=(+(d.dataset.errors||0)+1);console.error('page error',e.message)});

/* the page reads the clock through Date.now() only, so a test can move time */
const nowD=()=>new Date(Date.now());
const pad2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const DAYF=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONF=['january','february','march','april','may','june','july','august','september','october','november','december'];
const SCORE={5:'ultra productive',4:'fairly productive',3:'day-to-day upkeep',2:'less than that',1:'the worst'};
const AHEAD_COUNT=[1,2,3,5];
const AHEAD_NAME=['off','30 min','1 hour','2 hours'];
const AHEAD_OLED=['','+30','+1H','+2H'];
const NAV=['log','today','week','time'];
/* ---------- time ---------- */
const DAYS=['sun','mon','tue','wed','thu','fri','sat'];
const MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const hai=window.HH||null;
function pad(n){return pad2(n)}
function fmtBlock(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function bDate(b){return new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10),+b.slice(11,13),+b.slice(14,16))}
function bAdd(b,min){return fmtBlock(new Date(bDate(b).getTime()+min*60000))}
function floorBlock(ms){return fmtBlock(new Date(Math.floor(ms/1800000)*1800000))}
function clock12(d){let h=d.getHours()%12;if(h===0)h=12;return h+':'+pad2(d.getMinutes())}
function ampm(d){return d.getHours()>=12?'pm':'am'}
function rangeTxt(b){const s=bDate(b),e=new Date(s.getTime()+1800000);return clock12(s)+' – '+clock12(e)+' '+ampm(e)}
function clockTxt(b){return clock12(bDate(b))+' '+ampm(bDate(b))}
function dayTxt(d){return DAYS[d.getDay()]+' '+d.getDate()+' '+MONS[d.getMonth()]}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromKey(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))}
function shiftDay(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return dateKey(d)}
function weekDays(endKey){const end=fromKey(endKey),a=[];for(let i=6;i>=0;i--){const d=new Date(end);d.setDate(d.getDate()-i);a.push(d)}return a}
function hoursTxt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function idxOf(b){return Math.floor((bDate(b).getHours()*60+bDate(b).getMinutes())/30)}
function hmOfIdx(i){return pad2(Math.floor(i/2))+':'+(i%2?'30':'00')}
/* what people read: 1:30 pm, not 13:30 or 01:30 */
function hm12(i){i=((i%48)+48)%48;const h=Math.floor(i/2),hh=h%12||12;return hh+':'+(i%2?'30':'00')+' '+(h>=12?'pm':'am')}
function range12(a,z){return a===z?hm12(a):hm12(a)+' – '+hm12(z+1)}
function span12(a,z){const start=hm12(a),end=hm12(z);return start.slice(-2)===end.slice(-2)?start.slice(0,-3)+' – '+end:start+' – '+end}

/* Read explicit half-hour spans from a sentence. The returned blocks are local-time block keys. */
function parseSpans(text,block){
  /* speech writes numbers its own way: "an hour and 1/2", "2 hrs", "1.5 hours" */
  const source=String(text||'').trim()
    .replace(/\bhrs\b/gi,'hours').replace(/\bhr\b/gi,'hour').replace(/\bmins?\b/gi,'minutes')
    .replace(/\b(\d+)(?:\.5|\s*½|\s+1\/2)\s+hours?\b/gi,'$1 and a half hours')
    .replace(/½|\b1\/2\b/g,'half');
  if(!source||/\bnext\b/i.test(source)||!block)return null;
  const hourNames={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
  const hourAlt='12|11|10|[1-9]|twelve|eleven|ten|nine|eight|seven|six|five|four|three|two|one';
  const timeSrc='(?:noon|midnight|half\\s+past\\s+(?:'+hourAlt+')(?:\\s+(?:thirty|30))?|(?:'+hourAlt+')(?:\\s*:\\s*(?:00|30)|\\s+(?:thirty|00|30))?\\s*(?:a\\.?m\\.?|p\\.?m\\.?)?)';
  const timeCapture='('+timeSrc+')';
  const countAlt='(?:an?|\\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)';
  const durationAlt='(?:half\\s+(?:an?\\s+)?hour|'+countAlt+'\\s+hours?\\s+(?:and\\s+)?\\d+\\s+minutes?|'+countAlt+'\\s+hours?(?:\\s+and\\s+(?:a\\s+)?half)?|'+countAlt+'\\s+and\\s+(?:a\\s+)?half\\s+hours?|\\d+\\s+minutes?)';
  const cleanEnd=s=>String(s||'').trim().replace(/[\s.,;!?]+$/,'');
  const splitPieces=[];
  source.split(/\s*(?:\b(?:and\s+)?then\b|\bafter\s+that\b|;)\s*/i).forEach(group=>{
    const commaRe=new RegExp(',\\s*(?=(?:from\\s+)?'+timeSrc+'\\s+to\\b)','i');
    group.split(commaRe).forEach(p=>splitPieces.push(cleanEnd(p)));
  });
  if(splitPieces.some(p=>!p))return null;
  const words={an:1,a:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
  function parseClock(raw){
    let s=String(raw).trim().toLowerCase().replace(/\./g,'');
    if(s==='noon')return {hour:12,minute:0,meridiem:'pm',fixed:true};
    if(s==='midnight')return {hour:12,minute:0,meridiem:'am',fixed:true};
    let meridiem=null;
    const mark=s.match(/\s*(am|pm)$/);if(mark){meridiem=mark[1];s=s.slice(0,mark.index).trim()}
    let minute=0;
    if(/^half\s+past\s+/.test(s)){minute=30;s=s.replace(/^half\s+past\s+/,'')}
    else{
      let m=s.match(/^(.*?)\s*:\s*(00|30)$/);
      if(m){s=m[1].trim();minute=+m[2]}
      else if(/\s+(?:thirty|30)$/.test(s)){minute=30;s=s.replace(/\s+(?:thirty|30)$/,'')}
      else if(/\s+00$/.test(s)){s=s.replace(/\s+00$/,'')}
    }
    const hour=hourNames[s]||(/^\d+$/.test(s)?+s:0);
    if(hour<1||hour>12)return null;
    return {hour,minute,meridiem, fixed:false};
  }
  function durationMinutes(raw){
    const s=String(raw).trim().toLowerCase().replace(/\s+/g,' ');
    const count=w=>/^\d+$/.test(w)?+w:(words[w]||0);
    let value=0,m;
    if(/^half (?:an? )?hour$/.test(s))value=30;
    else if((m=s.match(/^(\S+) hours? and (?:a )?half$/))||(m=s.match(/^(\S+) and (?:a )?half hours?$/)))value=count(m[1])*60+30;
    else if((m=s.match(/^(\S+) hours? (?:and )?(\d+) minutes?$/)))value=count(m[1])*60+ +m[2];
    else if((m=s.match(/^(\S+) hours?$/)))value=count(m[1])*60;
    else if((m=s.match(/^(\d+) minutes?$/)))value=+m[1];
    return value>0&&value<=720?value:null;
  }
  function scoreTail(s){
    const m=s.match(/\s+(?:score\s+)?(1|2|3|4|5|one|two|three|four|five)\s*$/i);

function sampleEntries(){
  const out=[],now=nowD(),today=dateKey(now),cur=floorBlock(now.getTime());
  const blocks=[
    [0,8,'resting',3],[16,1,'getting ready',2],[18,1,'making coffee',3],[20,2,'reading',4],
    [23,2,'team meeting',3],[26,2,'eating lunch',3],[29,4,'building project',5],[33,1,'taking a walk',4],
    [35,1,'commuting',2],[37,3,'spending time with friends',4],[40,1,'buying groceries',3],[41,2,'cooking dinner',3],
    [44,2,'watching a movie',2]
  ];
  for(let back=20;back>=0;back--){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-back),dk=dateKey(d);
    const variance=(back*7)%3;
    blocks.forEach(([start,len,text,base],j)=>{
      const count=len+(j%4===variance%4?1:0);
      for(let n=0;n<count;n++){
        const idx=start+n,hm=hmOfIdx(idx),b=dk+'T'+hm;
        if(back===0&&(b>=cur||cur===floorBlock(now.getTime())&&idx>=Math.max(0,idxOf(cur)-3)))continue;
        if(j>0&&(back*13+idx*3)%13===0)continue;
        const score=Math.max(1,Math.min(5,base+(((back+j+n)%5===0)?-1:((back+j+n)%4===0?1:0))));
        out.push(mk(b,text,score,'app'));
      }
    });
  }
  return out.sort((a,b)=>a.block.localeCompare(b.block));
}
function mk(block,text,score,via){

function actOf(text){

  const rules=[
    ['exercise',/\b(working out|worked out|workout|gym|stretch|stretching|exercise|walk|walking|running|yoga|cycling|run|basketball)\b/],
    ['sleep',/\b(sleep|sleeping|nap|napping)\b/],['calls',/\b(call|calls|meeting|meet|client)\b/],
    ['travel',/\b(driving|drive|commute|travel|transit)\b/],['friends',/\b(friend|friends|hanging with friends|returning)\b/],['coffee',/\b(coffee|cafe|tea)\b/],
    ['chess',/\b(chess)\b/],['learning',/\b(learning|learn|reading|read|studying|study|ai)\b/],
    ['cooking',/\b(cook|cooking|meal prep|food prep|making food)\b/],
    ['eating',/\b(eat|eating|lunch|dinner|breakfast|meal)\b/],['going out',/\b(going out|getting ready)\b/],['errands',/\b(went to)\b/],
    ['groceries',/\b(groceries|grocery|shopping|buying groceries)\b/],['rest',/\b(rest|resting|chill|chilled|chilling|lazy|lazing|relax|shower|showering|woke up)\b/],
    ['movies',/\b(movie|movies|film|netflix|youtube)\b/],
    ['chores',/\b(clean|cleaning|trash|dish|dishes|laundry|vacuum|tidy|chores|housework|house things)\b/],
    ['building',/\b(build|building|code|coding|design|working)\b/]
  ];
  for(const [name,re] of rules)if(re.test(s))return name;
  if(/\b(logged|nothing|not sure|time waste)\b/.test(s))return 'other';
  const filler=new Set(['i','was','the','a','my','with','and','plus','to','of','for','don','t','dont','making','doing','some','just','more','working']);

/* A hold ends only when the finger comes off (or the system cancels the pointer). Moving off the
   key does not end it: pointer capture keeps the events on the key. A second pointer while a
   session is running is ignored. release() lets the page end a hold itself (the 3 minute limit). */
function bindHold(k,on,off){
  let held=false;
  const down=e=>{
    lg('hold down',k.id,'type',e.pointerType,'held',held);
    if(held)return;
    held=true;
    try{k.setPointerCapture(e.pointerId)}catch(_){}
    on();
    e.preventDefault();
  };
  const up=e=>{lg('hold up',k.id,'event',e&&e.type,'held',held);if(!held)return;held=false;off()};
  k.addEventListener('pointerdown',down);
  k.addEventListener('pointerup',up);
  k.addEventListener('pointercancel',up);
  k.addEventListener('contextmenu',e=>e.preventDefault());
  k.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e)});
  k.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){up();e.preventDefault()}});
  return {release:()=>up({type:'limit'})};
}

const recClock=()=>Math.floor(S.recT/60)+':'+pad2(S.recT%60);

function catchUp(){
  if(!S.block)return 0;

/* ---- the wireframe recorder: one hairline weight, the reel carries 48 notches, one per half hour ---- */

  const [ax,ay]=d1(30,315),[bx,by]=d1(11,315),[ex,ey]=d1(11,135),[fx,fy]=d1(30,135);

    <g class="reel">${t}<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/><line x1="${ex}" y1="${ey}" x2="${fx}" y2="${fy}"/>
      <circle cx="${cx}" cy="${cy-5}" r=".9"/><circle cx="${cx+4.3}" cy="${cy+2.5}" r=".9"/><circle cx="${cx-4.3}" cy="${cy+2.5}" r=".9"/>
      <text class="eng" x="${cx-21}" y="${cy-14}" transform="rotate(-45 ${cx-21} ${cy-14})">48 / 30</text></g>
    <circle cx="${cx}" cy="${cy}" r="9"/>
    <line x1="119" y1="38" x2="119" y2="100"/><rect x="113.5" y="82.5" width="11" height="6" rx="1"/>
    <line x1="111" y1="44" x2="114" y2="44"/><line x1="111" y1="62" x2="114" y2="62"/><line x1="111" y1="80" x2="114" y2="80"/><line x1="111" y1="98" x2="114" y2="98"/>
    <rect x="14.5" y="116.5" width="33" height="34" rx="2"/><rect x="51.5" y="116.5" width="33" height="34" rx="2"/><rect x="88.5" y="116.5" width="33" height="34" rx="2"/>
    <circle class="mdot" cx="31" cy="129" r="3.4"/><line x1="62.5" y1="127" x2="73.5" y2="127"/><line x1="62.5" y1="131" x2="73.5" y2="131"/><rect x="101.5" y="125.5" width="7" height="7"/>
  </svg>`;
}

/* ---- score: the paper line's stations, a machined cap that slides between them ---- */
const tpos=f=>`calc(22px + (100% - 44px) * ${f})`;
function buildTrack(el,get,set){
  el.innerHTML='<span class="groove"></span>'+[1,2,3,4,5].map(n=>`<span class="st" data-n="${n}" style="left:${tpos((n-1)/4)}"><i></i><b>${n}</b></span>`).join('')+'<span class="capk"></span>';
  const at=e=>{const r=el.getBoundingClientRect();return Math.max(1,Math.min(5,Math.round((e.clientX-r.left-22)/(r.width-44)*4)+1))};
  let drag=false;
  el.addEventListener('pointerdown',e=>{drag=true;try{el.setPointerCapture(e.pointerId)}catch(_){}if(at(e)!==get())set(at(e));e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(drag&&at(e)!==get())set(at(e))});
  ['pointerup','pointercancel'].forEach(t=>el.addEventListener(t,()=>{drag=false}));
  el.addEventListener('keydown',e=>{
    const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!d)return;
    set(Math.max(1,Math.min(5,get()+d)));e.preventDefault();
  });
}
function paintTrack(el,v){
  el.querySelector('.capk').style.left=tpos((v-1)/4);

}

/* ---- log ahead: the vertical fader beside the keys ---- */
const faderY=k=>11+(1-k/3)*78;
function buildFader(){
  const f=$('log-slider');
  f.innerHTML='<span class="gv"></span>'+['off','30m','1h','2h'].map((t,k)=>`<span class="s2" data-k="${k}" style="top:${faderY(k)}%">${t}</span>`).join('')+'<span class="fc" id="fc"></span>';
  const at=e=>{const r=f.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*100;return Math.max(0,Math.min(3,Math.round((1-(y-11)/78)*3)))};
  let drag=false;
  f.addEventListener('pointerdown',e=>{drag=true;try{f.setPointerCapture(e.pointerId)}catch(_){}setAhead(at(e));e.preventDefault()});
  f.addEventListener('pointermove',e=>{if(drag)setAhead(at(e))});
  ['pointerup','pointercancel'].forEach(t=>f.addEventListener(t,()=>{drag=false}));
  f.addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!d)return;setAhead(Math.max(0,Math.min(3,(S.ahead||0)+d)));e.preventDefault()});

/* ---------- log screen ---------- */

const toWords=s=>String(s).replace(' – ',' to ');

    const cur=floorBlock(Date.now());

    else w=S.block===cur?'in progress now':'later today';

/* ‹ and › walk half hours. › never passes the block pickBlock() would choose; ‹ stops 7 days back. */
function canStep(min){
  const b=bAdd(S.block,min);
  if(min>0)return b<=floorBlock(Date.now());
  return bDate(b).getTime()>=Date.now()-7*86400000;
}
function stepLog(min){

}
function drawPlanLine(){

/* the speak key's state: idle, listening, working it out, or an error */
function drawRec(){

function paintScore(){

}

function setLogScore(v,fromDrag){
  v=Math.max(1,Math.min(5,Math.round(+v||3)));
  if(v===S.score)return;
  S.score=v;
  hh('score');

}
function pickBlock(){return leftOff()}
function leftOff(){
  const cur=floorBlock(Date.now()),last= M.list.filter(e=>e.block<=cur).reduce((a,e)=>!a||e.block>a.block?e:a,null);
  if(!last)return cur;
  if(bDate(cur).getTime()-bDate(last.block).getTime()>7*86400000)return cur;
  let b=bAdd(last.block,30),steps=0;
  while(b<=cur&&steps++<336){if(!entryAt(b)&&!inSleep(b))return b;b=bAdd(b,30)}
  return cur;
}
function openLog(block){
  window.clearTimeout(S.hopTimer); // any other way of landing on a half hour cancels a pending hop
  S.block=block||pickBlock();
  const e=entryAt(S.block);
  S.text=e?e.text:'';
  S.score=e?+e.score:3;
  S.plan=cleanPlan(e&&e.plan)||(hai?cleanPlan(hai.plan(bAdd(S.block,30))):'');
  S.spanDismissText='';S.spanPending=null;
  renderLog();
}
function pips(s){let o='<span class="pips" aria-label="score '+s+'">';for(let i=1;i<=5;i++)o+=`<i class="${i<=s?'on':''}"></i>`;return o+'</span>'}
function spanTimeLabel(span){
  const a=bDate(span.start),z=bDate(span.end),dayChange=dateKey(a)!==dateKey(z);
  return clock12(a)+' '+ampm(a)+' – '+clock12(z)+' '+ampm(z)+(dayChange?' · '+dayTxt(a):'');
}
function syncScrim(){$('scrim').classList.toggle('on',!$('sheet').hidden||!$('span-sheet').hidden)}
function openSpanSheet(spans){
  S.spanPending={spans:spans,text:S.text,block:S.block};S.ahead=0;drawSlider();
  $('span-heard').textContent=S.text;

  }).join('');

function closeSpanSheet(cancelled){

  S.spanPending=null;syncScrim();
}
function saveLogPayloads(payloads,first,fallbackLast){
  payloads.forEach(p=>{if(hai){try{hai.save(JSON.stringify(p))}catch(e){}}else saveLocal(p)});
  loadData();hh('confirm');S.ahead=0;S.spanDismissText='';
  const last=payloads.length?payloads[payloads.length-1].block:(fallbackLast||first);
  openLog(first);drawSlider();
  let next='',b=bAdd(last,30),limit=0;
  while(b<=floorBlock(Date.now())&&limit++<336){if(isPending(b)){next=b;break}b=bAdd(b,30)}
  if(!next&&isPending(bAdd(first,-30)))next=bAdd(first,-30);
  if(next){S.block=last;S.hopTimer=window.setTimeout(()=>{if(S.screen==='log'){hh('slice');openLog(next)}},650)}
}
function confirmSpanSheet(){
  const pending=S.spanPending;if(!pending)return;
  const payloads=[];
  pending.spans.forEach(span=>{
    for(let b=span.start;b<span.end;b=bAdd(b,30)){
      if(entryAt(b))continue;
      payloads.push({block:b,text:span.text,score:span.score==null?S.score:span.score,plan:'',via:'app'});
    }
  });
  payloads.sort((a,b)=>a.block.localeCompare(b.block));
  const first=pending.spans[0].start,last=pending.spans[pending.spans.length-1].end;
  closeSpanSheet(false);
  saveLogPayloads(payloads,first,bAdd(last,-30));
}
function logIt(options={}){
  const raw=(S.text||'').trim()||'logged';
  const split=splitPlan(raw),text=(split.text||raw).trim()||'logged';
  if(split.plan)setPlan(split.plan);
  if(!options.skipSpanCheck&&raw!==S.spanDismissText){
    const spans=parseSpans(text,S.block);
    if(spans){S.text=text;$('log-text').value=text;drawPlanLine();drawSaveState();openSpanSheet(spans);return}
  }
  if(text!==S.text){S.text=text;$('log-text').value=text}
  const counts=AHEAD_COUNT,blocks=[];
  for(let i=0;i<counts[S.ahead||0];i++)blocks.push(bAdd(S.block,30*i));
  const payloads=[];
  blocks.forEach((block,i)=>{if(i===0||!entryAt(block))payloads.push({block,text,score:S.score,plan:i===blocks.length-1?cleanPlan(S.plan):'',via:'app'})});
  saveLogPayloads(payloads,S.block,payloads.length?payloads[payloads.length-1].block:S.block);
}
function isPending(b){
  if(entryAt(b)||b>floorBlock(Date.now()-1800000))return false;
  return !inSleep(b)&&bDate(b).getTime()>=Date.now()-7*86400000;
}
/* The log it key says "logged" for as long as the shown half hour is saved and unchanged,

function sameAgain(){

/* ---------- today: raw grid's 48 ruled cells, paper line's tape bars inside them ---------- */
const BAR={1:8,2:13.5,3:19,4:24.5,5:30};
const uniq=a=>Array.from(new Set(a)).sort((x,y)=>x-y);
function cellsLive(){return S.filled&&S.filled.until>Date.now()?S.filled.idx:[]}
function drawGrid(){
  const B=todayBlocks(),hot=cellsLive(),isToday=S.todayDay===todayKey();
  let h='',sleepSeen=false;
  for(let i=0;i<48;i++){
    const b=B[i],e=b.e,isSleepLog=e&&actOf(e.text)==='sleep';
    let cls='cell ';

    else if(b.st==='sleep'||isSleepLog){cls+='sl';sleepSeen=true}
    else if(b.st==='missed')cls+='e';
    else cls+='f';

    if(hot.indexOf(i)>=0)cls+=' hot';

    if(e&&!isSleepLog)inner+=`<em>${+e.score||''}</em><b style="height:${BAR[Math.max(1,Math.min(5,+e.score||1))]}px"></b>`;
    if(isToday&&b.st==='now')inner+='<span class="now" style="left:13%"></span>';
    const label=hm12(i)+', '+(e?esc(e.text)+', '+e.score:b.st==='log'?'logged':b.st==='sleep'?'sleep':b.st==='missed'?'empty':b.st==='now'?'now':'not yet');

  }

}
function eligibleOf(B,idxs){
  const cur=floorBlock(Date.now());
  return idxs.filter(i=>{const b=B[i];return !b.e&&(b.st==='missed'||b.st==='sleep')&&b.block<cur});
}
function latestMissedRun(B){
  const missed=B.filter(b=>b.st==='missed');
  if(!missed.length)return [];
  const latest=missed[missed.length-1].idx,range=[];
  for(let i=latest;i>=0&&B[i].st==='missed';i--)range.unshift(i);
  return range;
}
function drawReadout(){
  const B=todayBlocks(),el=$('tod-line'),isToday=S.todayDay===todayKey(),st=dayStats(S.todayDay);
  let rd='';

    const picks=S.sel.slice().sort((a,b)=>a-b),runs=[],groups={};
    picks.forEach(i=>{const last=runs[runs.length-1];if(last&&last[1]+1===i)last[1]=i;else runs.push([i,i])});
    picks.forEach(i=>{const b=B[i],name=b.e?actOf(b.e.text):b.st==='sleep'?'sleep':'not logged';groups[name]=(groups[name]||0)+.5});
    const elig=eligibleOf(B,picks),one=picks.length===1?B[picks[0]]:null;
    const times=runs.map(([a,z])=>toWords(span12(a,z+1))).join(' · ');
    const items=scored(picks.map(i=>B[i].e).filter(Boolean)),avg=items.length?items.reduce((a,e)=>a+(+e.score||0),0)/items.length:null;
    let x,s;

    else if(one){x=one.st==='sleep'?'sleep':one.st==='now'?'in progress now':one.st==='future'?'not yet':'nothing logged';s=elig.length?'empty, it can be filled':''}
    else{x=hoursTxt(picks.length/2)+' h picked';s=Object.entries(groups).map(([n,h])=>`${esc(n)} ${hoursTxt(h)} h`).join(' · ')+(avg==null?'':' · avg '+avg.toFixed(1))}
    let keys='';
    if(elig.length)keys+='<button type="button" class="mkey" id="tod-fill" data-act="fill">fill it</button>';
    if(one&&one.e)keys+=`<button type="button" class="mkey" id="tod-edit" data-act="edit:${one.block}">edit</button>`;
    keys+='<button type="button" class="mkey" id="tod-clear" data-act="clear">clear</button>';
    rd=`<div class="t">${esc(times)}</div><div class="x">${x}</div><div class="s"><span>${s}</span><span class="ks">${keys}</span></div>`;
  }else{
    const run=latestMissedRun(B),missed=B.filter(b=>b.st==='missed').length;

/* a hold of 350 ms starts a selection that adds to the one already there; a plain drag of 14 px or
   more starts one that replaces it. a tap reads one half hour, a second tap on it lets go. */
function bindGrid(){
  const g=$('tod-grid');let press=null;
  const slotAt=e=>{
    const r=g.getBoundingClientRect(),top=r.top+g.clientTop,h=g.clientHeight||r.height,w=g.clientWidth||r.width;
    const x=Math.max(0,Math.min(w-.01,e.clientX-r.left-g.clientLeft)),y=Math.max(0,Math.min(h-.01,e.clientY-top));
    return Math.min(5,Math.floor(y/(h/6)))*8+Math.min(7,Math.floor(x/(w/8)));
  };
  g.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    try{g.setPointerCapture(e.pointerId)}catch(_){}
    press={x:e.clientX,y:e.clientY,start:slotAt(e),holding:false,ids:[],base:[],last:-1,timer:0};
    const me=press;
    me.timer=window.setTimeout(()=>{if(press!==me||me.holding)return;me.holding=true;me.base=S.sel.slice();me.ids=[me.start];S.sel=uniq(me.base.concat(me.ids));hh('confirm');drawSelection()},350);
  });
  g.addEventListener('pointermove',e=>{
    if(!press)return;
    const dist=Math.hypot(e.clientX-press.x,e.clientY-press.y);
    if(!press.holding&&dist>=14){window.clearTimeout(press.timer);press.holding=true;press.base=[];press.ids=[press.start];S.sel=[press.start];hh('slice');drawSelection()}
    if(press.holding){
      const i=slotAt(e);
      if(i!==press.last){press.last=i;hh('slice');const a=Math.min(press.start,i),z=Math.max(press.start,i),range=[];for(let k=a;k<=z;k++)range.push(k);press.ids=range;S.sel=uniq(press.base.concat(range));drawSelection()}
    }
  });
  g.addEventListener('pointerup',e=>{
    if(!press)return;
    window.clearTimeout(press.timer);const st=press;press=null;
    if(st.holding){S.sel=uniq(S.sel.concat(st.ids));drawSelection();return}
    S.sel=(S.sel.length===1&&S.sel[0]===st.start)?[]:[st.start];
    drawSelection();
  });
  /* the system took the touch (a scroll): keep what a hold already picked, never turn it into a tap */
  g.addEventListener('pointercancel',()=>{if(!press)return;window.clearTimeout(press.timer);press=null});
  g.addEventListener('touchmove',e=>{if(press&&press.holding)e.preventDefault()},{passive:false});
  g.addEventListener('contextmenu',e=>e.preventDefault());
  g.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const B=todayBlocks(),m=B.find(b=>b.st==='missed');
    if(m)openSheet([m.idx]);
    e.preventDefault();
  });
}

/* ---------- week: paper line's table, each day a strip of its own tape on a shared clock ---------- */
function miniTape(dk,mark){
  const list=dayList(dk),by={};list.forEach(e=>{by[idxOf(e.block)]=e});
  let g='';
  [60,120,180].forEach(x=>g+=`<rect x="${x}" y="0" width=".7" height="24" fill="var(--faint)"/>`);
  g+='<rect x="0" y="23" width="240" height="1" fill="var(--hair)"/>';
  for(let i=0;i<48;i++){
    const x=i*5,e=by[i];
    if(e&&actOf(e.text)!=='sleep'){const h=4+Math.max(1,Math.min(5,+e.score||1))*3.8;g+=`<rect x="${x+.9}" y="${23-h}" width="3.2" height="${h}" fill="var(--ink)"/>`}
    else if(inSleep(dk+'T'+hmOfIdx(i))&&list.length)g+=`<rect x="${x}" y="20" width="5.1" height="2" fill="#96938c"/>`;
  }
  if(mark){const n=nowD(),x=(n.getHours()*60+n.getMinutes())/1440*240;g+=`<rect class="mk-today" x="${(x-.6).toFixed(1)}" y="0" width="1.6" height="24" fill="var(--acc)"/>`}
  return `<svg viewBox="0 0 240 24" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
}
function weekModel(){
  const days=weekDays(S.weekEnd);
  const stats=days.map(d=>{const dk=dateKey(d),list=scored(dayList(dk)),b={high:0,medium:0,low:0};list.forEach(e=>b[(+e.score||0)>=4?'high':(+e.score||0)>=3?'medium':'low']+=.5);return {d:d,dk:dk,avg:dayStats(dk).avg,n:list.length,...b}});
  const vals=stats.filter(s=>s.n>0).map(s=>s.avg);
  const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const total=stats.reduce((a,s)=>a+s.n*.5,0),high=stats.reduce((a,s)=>a+s.high,0),prev=weekDays(shiftDay(S.weekEnd,-7));
  const prevHigh=prev.reduce((a,d)=>a+scored(dayList(dateKey(d))).filter(e=>(+e.score||0)>=4).length*.5,0);
  let best=null;stats.forEach(s=>{if(s.n>0&&(!best||s.avg>best.avg))best=s});
  /* the best hours: average score by half hour across the week, and the best stretch of four */
  const acc=[];for(let i=0;i<48;i++)acc.push([]);
  days.forEach(d=>{const dk=dateKey(d);scored(M.list).forEach(e=>{if(e.block.slice(0,10)===dk){acc[idxOf(e.block)].push(+e.score||0)}})});
  const avgs=acc.map(a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null);
  let peak=-1,peakVal=-1;
  for(let i=0;i<45;i++){
    const w=avgs.slice(i,i+4).filter(v=>v!==null);
    if(w.length<2)continue;
    const m=w.reduce((a,b)=>a+b,0)/w.length;
    if(m>peakVal){peakVal=m;peak=i}
  }
  return {days,stats,vals,avg,total,high,delta:high-prevHigh,best,avgs,peak,peakVal};
}

/* ---------- time: one fixed box. bento by default (area = time), the reel discs behind a switch ---------- */
function squarify(items,X,Y,W,H){
  const out=[],total=items.reduce((a,b)=>a+b.v,0),sc=W*H/total;let rest=items.slice(),row=[];
  const worst=(r,side)=>{if(!r.length)return Infinity;const s=r.reduce((a,b)=>a+b.v*sc,0),mx=Math.max(...r.map(q=>q.v*sc)),mn=Math.min(...r.map(q=>q.v*sc));
    return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))};
  const lay=()=>{const s=row.reduce((a,b)=>a+b.v*sc,0);
    if(W>=H){const cw=s/H;let cy=Y;row.forEach(r=>{const rh=r.v*sc/cw;out.push({...r,x:X,y:cy,w:cw,h:rh});cy+=rh});X+=cw;W-=cw}
    else{const ch=s/W;let cx=X;row.forEach(r=>{const rw=r.v*sc/ch;out.push({...r,x:cx,y:Y,w:rw,h:ch});cx+=rw});Y+=ch;H-=ch}
    row=[]};
  while(rest.length){const side=Math.min(W,H);if(!row.length||worst([...row,rest[0]],side)<=worst(row,side))row.push(rest.shift());else lay()}
  if(row.length)lay();return out;
}
function bentoHTML(acts,W,H){
  const G=5,rects=squarify(acts.map((a,i)=>({a,i,v:a.h})),0,0,W-G,H-G);
  return rects.map(r=>{const w=r.w-G,h=r.h-G,big=w>120&&h>96,tiny=h<50;
    return `<button type="button" class="tile ${big?'big':''}" data-act="timePick:${r.i}" aria-pressed="${r.i===S.timePick}" aria-label="${esc(r.a.n)}, ${fmtH(r.a.h)} hours"
      style="left:${(r.x+G).toFixed(1)}px;top:${(r.y+G).toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px${tiny?';padding-top:6px;padding-bottom:6px':''}">
      <span class="n">${esc(r.a.n)}</span><span class="h">${fmtH(r.a.h)}${big?'<small>h</small>':' h'}</span></button>`}).join('');
}
function discsHTML(acts,W,H){
  const GAP=12,LBL=24,IW=W-28;
  const pack=k=>{const rs=[];let row=[],w=0;acts.forEach((a,i)=>{const d=Math.max(28,k*Math.sqrt(a.h)),cw=Math.max(d,58),need=(row.length?GAP:0)+cw;
    if(w+need>IW&&row.length){rs.push(row);row=[];w=0}row.push({...a,i,d,cw});w+=(row.length>1?GAP:0)+cw});if(row.length)rs.push(row);return rs};
  let k=60,rows,tot;
  for(;k>14;k--){rows=pack(k);tot=rows.reduce((s,r)=>s+Math.max(...r.map(q=>q.d))+LBL,0)+(rows.length-1)*10;if(tot<=H-30)break}
  let y=(H-tot)/2,out='';
  rows.forEach(r=>{const rh=Math.max(...r.map(q=>q.d)),tw=r.reduce((s,q)=>s+q.cw,0)+GAP*(r.length-1);let x=(W-tw)/2;
    r.forEach(q=>{out+=`<button type="button" class="disc" data-act="timePick:${q.i}" aria-pressed="${q.i===S.timePick}" aria-label="${esc(q.n)}, ${fmtH(q.h)} hours"
      style="left:${x.toFixed(1)}px;top:${(y+rh-q.d).toFixed(1)}px;width:${q.cw.toFixed(1)}px"><i style="width:${q.d.toFixed(1)}px;height:${q.d.toFixed(1)}px"></i><span>${esc(q.n)}</span></button>`;x+=q.cw+GAP});
    y+=rh+LBL+10});
  return out;
}
function timeModel(){
  const days=S.timeMode==='day'?[fromKey(S.timeEnd)]:weekDays(S.timeEnd);
  const lo=dateKey(days[0]),hi=dateKey(days[days.length-1]);
  const groups={};let total=0;
  scored(M.list).forEach(e=>{
    const d=e.block.slice(0,10);
    if(d<lo||d>hi)return;
    const k=actOf(e.text)||'other';
    const g=groups[k]||(groups[k]={id:k,n:k,h:0,sum:0,c:0,runs:0,last:null,days:new Set()});
    g.h+=0.5;g.sum+=+e.score||0;g.c++;total+=0.5;
    if(!g.last||bAdd(g.last,30)!==e.block)g.runs++;
    g.last=e.block;g.days.add(d);
  });
  const list=Object.values(groups).map(g=>({id:g.id,n:g.n,h:g.h,avg:g.sum/g.c,runs:g.runs,days:g.days.size})).sort((a,b)=>b.h-a.h||b.runs-a.runs).slice(0,TIME_BUBBLE_LIMIT);
  return {days,total,list};
}

  box.className='box '+(bento?'bento':'discs');
  const W=box.clientWidth||Math.max(0,stageW-26),H=Math.round(Math.max(240,Math.min(420,(el.clientHeight||stageH-64)-290)));
  box.style.height=H+'px';
  const fresh=lastView!==S.timeView;lastView=S.timeView;
  if(S.timePick>=m.list.length)S.timePick=0;
  if(!m.list.length){box.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;font:300 20px var(--disp);color:#b4b1ab" id="tm-empty">nothing logged yet</div>';$('tm-pick').innerHTML='';drawHeader();return}
  box.innerHTML=`<div class="${fresh?'fadein':''}" style="position:absolute;inset:0">${bento?bentoHTML(m.list,W,H):discsHTML(m.list,W,H)}</div>`;
  const p=m.list[S.timePick]||m.list[0];
  $('tm-pick').innerHTML=`<div class="big" id="tm-name">${esc(p.n)}</div><div class="d" id="tm-detail">${fmtH(p.h)} hours over ${p.runs} ${p.runs===1?'stretch':'stretches'}, average ${p.avg.toFixed(1)}${S.timeMode==='week'?', on '+p.days+' of 7 days':''}.</div>`;
  drawHeader();
}

/* ---------- layout: the page is the window ---------- */
let INS={top:0,right:0,bottom:0,left:0};
function bridgeInsets(){
  if(!hai||typeof hai.insets!=='function')return;
  try{
    const p=String(hai.insets()||'').split(',').map(Number);
    if(p.length===4&&p.every(n=>isFinite(n)))INS={top:p[0],right:p[1],bottom:p[2],left:p[3]};
  }catch(e){}
}
window.HHinsets=function(t,r,b,l){
  INS={top:+t||0,right:+r||0,bottom:+b||0,left:+l||0};
  fit();
};
function fit(){
  const vw=window.innerWidth,vh=window.innerHeight,st=$('stage');
  /* a phone in the hand fills the window; a wide browser window shows a 380 px phone in the middle */
  const desk=!hai&&vw>600;
  let left,top,w,h;
  if(desk){w=380;h=Math.max(680,Math.min(900,vh));left=Math.max(0,Math.round((vw-w)/2));top=Math.max(0,Math.round((vh-h)/2))}
  else{left=INS.left;top=INS.top;w=Math.max(0,vw-INS.left-INS.right);h=Math.max(0,vh-INS.top-INS.bottom)}
  document.body.classList.toggle('desk',desk);
  st.style.left=left+'px';st.style.top=top+'px';st.style.width=w+'px';st.style.height=h+'px';
  if(S.screen==='time')renderTime();
}

/* ---------- screens slide, never cut ---------- */
let anims=[];
function slide(a,b){
  anims.forEach(x=>x.cancel());anims=[];document.querySelectorAll('.screen.leaving').forEach(x=>x.classList.remove('leaving'));
  if(RM()||a===b)return;
  const A=$('s-'+a),B=$('s-'+b),dir=NAV.indexOf(b)>NAV.indexOf(a)?1:-1,o={duration:460,easing:'cubic-bezier(.33,0,.12,1)'};
  A.classList.add('leaving');
  anims=[B.animate([{transform:`translateX(${dir*100}%)`},{transform:'translateX(0)'}],o),
         A.animate([{transform:'translateX(0)'},{transform:`translateX(${-dir*30}%)`,opacity:.35}],o)];
  anims[1].onfinish=()=>{A.classList.remove('leaving');anims=[]};
}
function navPaint(name){
  const idx=NAV.indexOf(name);
  document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-current',i===idx));
  $('navInd').style.transform='translateX('+(idx*100)+'%)';
}
function go(name){
  if(name==='nudge')name='log'; // retired: the ping opens log
  lg('go',name);
  if(!$('s-'+name))return;
  const prev=S.screen;
  if(name==='today'){const today=todayKey();if(S.todayDay!==today)S.sel=[];S.todayDay=today;}
  if(name==='week')S.weekEnd=todayKey();
  if(name==='time'){S.timeMode='week';S.timeEnd=todayKey()}
  S.screen=name;
  document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on',el.id==='s-'+name));
  navPaint(name);
  closeSheetQuiet();
  if(name==='log')openLog(leftOff());
  if(name==='today')renderToday();
  if(name==='week')renderWeek();
  if(name==='time')renderTime();
  if(prev!==name){$('s-'+name).scrollTop=0;slide(prev,name)}
  if(hai){try{hai.screen(name)}catch(e){}}
  if(!hai){try{if(location.hash!=='#'+name)history.replaceState(null,'','#'+name)}catch(e){}}
}
function openToday(day){
  S.todayDay=day||todayKey();S.sel=[];
  const screen=$('s-today');if(screen)screen.scrollTop=0;
  if(S.screen==='today')renderToday();else{
    const keep=S.todayDay;go('today');S.todayDay=keep;renderToday();
  }
}
function closeSheetQuiet(){const sh=$('sheet');if(sh&&!sh.hidden){sh.hidden=true;S.sel=[];S.sheetSel=[]}const spans=$('span-sheet');if(spans&&!spans.hidden)closeSpanSheet(false);syncScrim()}
function HHopen(block){
  if(!block)return;
  go('log');
  openLog(block||leftOff());
}
function HHgo(name){go(name)}
function HHresume(){const inp=$('log-text'),saved=(entryAt(S.block)&&entryAt(S.block).text)||'';if(S.screen==='log'&&document.activeElement!==inp&&inp.value===saved&&Date.now()-(S.lastTouch||0)>120000)openLog(leftOff())}

/* ---------- wiring ---------- */
const ACTS={
  go:n=>{hh('confirm');go(n)},
  fill:()=>{hh('confirm');fillAct()},
  clear:()=>{S.sel=[];drawSelection()},
  edit:b=>{hh('confirm');go('log');openLog(b)},
  openDay:dk=>openToday(dk),
  timeMode:m=>{S.timeMode=m;S.timePick=0;renderTime()},
  timeView:v=>{S.timeView=v;hh('score');renderTime()},
  timePick:i=>{S.timePick=+i;hh('score');renderTime()}
};
function wire(){
  document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
    const k=t.dataset.act.indexOf(':'),a=k<0?t.dataset.act:t.dataset.act.slice(0,k),arg=k<0?undefined:t.dataset.act.slice(k+1);
    if(ACTS[a]){e.preventDefault();ACTS[a](arg)}});
  /* keys go down under the finger and spring back: a real depth change, held a beat so a quick tap still shows */
  document.addEventListener('pointerdown',e=>{S.lastTouch=Date.now();const k=e.target.closest('.key,.mkey,.tile');if(k)k.classList.add('down')},{passive:true});
  const lift=()=>window.setTimeout(()=>document.querySelectorAll('.down').forEach(k=>k.classList.remove('down')),90);
  ['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lift));

  document.querySelector('.machine .mwrap').insertAdjacentHTML('afterbegin',machineSVG());
  const inp=$('log-text');
  inp.addEventListener('input',()=>{S.text=inp.value;drawSaveState()});
  inp.addEventListener('focus',()=>{inp.select();drawRec()});
  inp.addEventListener('blur',drawRec);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();logIt()}});
  $('sheet-text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});

  $('log-save').addEventListener('click',()=>logIt());
  $('log-same').addEventListener('click',()=>sameAgain());
  $('span-x').addEventListener('click',()=>closeSpanSheet(true));
  $('span-ok').addEventListener('click',confirmSpanSheet);
  $('scrim').addEventListener('click',()=>{if(!$('span-sheet').hidden)closeSpanSheet(true);else if(!$('sheet').hidden)closeSheet()});
  $('log-prev').addEventListener('click',()=>stepLog(-30));
  $('log-next').addEventListener('click',()=>stepLog(30));
  $('log-block').addEventListener('click',()=>{hh('confirm');openLog(floorBlock(Date.now()))});
  holdLog=bindHold($('log-rec'),()=>beginSpeech('log'),endSpeech);
  buildTrack($('log-score'),()=>S.score,v=>setLogScore(v,true));
  buildFader();
  document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('hid',document.hidden)});

  bindGrid();
  $('sheet-x').addEventListener('click',closeSheet);
  $('sheet-ok').addEventListener('click',sheetLog);
  bindHold($('sheet-rec'),()=>beginSpeech('sheet'),endSpeech);
  buildTrack($('sheet-score'),()=>S.sheetScore,v=>{if(v!==S.sheetScore){S.sheetScore=v;hh('score');drawSheetScore()}});

  $('tod-prev').addEventListener('click',()=>{hh('slice');openToday(shiftDay(S.todayDay,-1))});
  $('tod-next').addEventListener('click',()=>{if(S.todayDay===todayKey())return;hh('slice');openToday(shiftDay(S.todayDay,1))});
  $('tod-date').addEventListener('click',()=>{if(S.todayDay!==todayKey()){hh('confirm');openToday(todayKey())}});
  $('wk-prev').addEventListener('click',()=>{hh('slice');S.weekEnd=shiftDay(S.weekEnd,-7);$('s-week').scrollTop=0;renderWeek()});
  $('wk-next').addEventListener('click',()=>{if(S.weekEnd===todayKey())return;hh('slice');S.weekEnd=shiftDay(S.weekEnd,7);$('s-week').scrollTop=0;renderWeek()});
  $('wk-range').addEventListener('click',()=>{if(S.weekEnd!==todayKey()){hh('confirm');S.weekEnd=todayKey();renderWeek()}});
  $('tm-day').addEventListener('click',()=>ACTS.timeMode('day'));
  $('tm-week').addEventListener('click',()=>ACTS.timeMode('week'));
  $('tm-bento').addEventListener('click',()=>ACTS.timeView('bento'));
  $('tm-discs').addEventListener('click',()=>ACTS.timeView('discs'));
  $('tm-prev').addEventListener('click',()=>{hh('slice');S.timeEnd=shiftDay(S.timeEnd,S.timeMode==='day'?-1:-7);$('s-time').scrollTop=0;renderTime()});
  $('tm-next').addEventListener('click',()=>{if(S.timeEnd===todayKey())return;hh('slice');S.timeEnd=shiftDay(S.timeEnd,S.timeMode==='day'?1:7);renderTime()});
  $('tm-range').addEventListener('click',()=>{if(S.timeEnd!==todayKey()){hh('confirm');S.timeEnd=todayKey();renderTime()}});

  window.addEventListener('resize',fit);
  if(!hai)window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(h&&h!==S.screen)go(h)});
}

/* ---------- boot ---------- */
function minuteTick(){
  if(hai&&S.screen==='log'){
    let p='';
    try{p=hai.plan(bAdd(S.block,30))||''}catch(e){}
    S.plan=cleanPlan(p);
    drawPlanLine();drawSlider();drawLogFoot();
  }
  if(S.screen==='today'&&S.todayDay===todayKey())drawGrid();
  drawOled();
}
(function boot(){
  const bootHash=location.hash.replace('#','');
  bridgeInsets();
  fit();
  if(hai){try{const q=hai.quiet();if(q){const p=String(q).split(/[-,]/);quietA=+p[0]||2;quietB=+p[1]||10}}catch(e){}}
  loadData();
  S.block=leftOff();
  wire();
  openLog(S.block);
  const open=hai?hai.openBlock():'';
  if(open)openLog(open);
  go('log');
  if(!open&&bootHash&&$('s-'+bootHash))go(bootHash);
  window.setInterval(minuteTick,30000);
})();
</script></body></html>
